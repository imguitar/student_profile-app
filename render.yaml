services:
  - type: web
    name: student-profile-api
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: university
      - key: DB_SSL
        value: "true"
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: CORS_ORIGIN
        sync: false

